name: CI

on:
  push:
    branches: [main, feat/v5-7-second-edge-data-completion, feat/v5-8-regime-reconstruction, feat/v5-9-meta-label-validation]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm validate:v5-5
      - run: pnpm validate:v5-6-1
      - run: pnpm validate:v5-7
      - run: pnpm validate:v5-8
      - run: pnpm validate:v5-9
