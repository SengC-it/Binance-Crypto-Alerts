name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm validate:v5-5
      - name: Prepare monitoring-only release validation
        run: |
          git fetch origin release/monitoring-only-v1
          git worktree add --detach "$RUNNER_TEMP/release-monitoring-only" origin/release/monitoring-only-v1
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/release-monitoring-only/node_modules"
      - name: Validate monitoring-only release
        working-directory: ${{ runner.temp }}/release-monitoring-only
        run: |
          export GITHUB_HEAD_REF=release/monitoring-only-v1
          pnpm validate:release:monitoring
      - run: pnpm validate:prc1
